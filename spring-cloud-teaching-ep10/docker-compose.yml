version: '3.8'

networks:
  teaching-network:
    driver: bridge

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
  skywalking-data:

services:
  # 基础设施
  mysql:
    image: mysql:8.0
    container_name: teaching-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - teaching-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 微服务治理
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: teaching-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
    ports:
      - "8848:8848"
      - "9848:9848"
    networks:
      - teaching-network

  sentinel:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: teaching-sentinel
    restart: unless-stopped
    ports:
      - "8858:8858"
    environment:
      AUTH_USERNAME: sentinel
      AUTH_PASSWORD: sentinel
    networks:
      - teaching-network

  seata-server:
    image: seataio/seata-server:1.7.0
    container_name: teaching-seata
    restart: unless-stopped
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      SEATA_IP: seata-server
      SEATA_PORT: 8091
      STORE_MODE: file
    networks:
      - teaching-network

  # 监控
  prometheus:
    image: prom/prometheus:latest
    container_name: teaching-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - teaching-network

  grafana:
    image: grafana/grafana:latest
    container_name: teaching-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks:
      - teaching-network

  # 链路追踪
  elasticsearch:
    image: elasticsearch:7.17.0
    container_name: teaching-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - skywalking-data:/usr/share/elasticsearch/data
    networks:
      - teaching-network

  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: teaching-skywalking-oap
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      SW_STORAGE: elasticsearch
      SW_STORAGE_ES_CLUSTER_NODES: elasticsearch:9200
    ports:
      - "11800:11800"
      - "12800:12800"
    networks:
      - teaching-network

  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: teaching-skywalking-ui
    restart: unless-stopped
    depends_on:
      - skywalking-oap
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    ports:
      - "8088:8080"
    networks:
      - teaching-network

  # 业务服务
  order-service:
    build: ./services/order-service
    container_name: teaching-order-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    networks:
      - teaching-network

  stock-service:
    build: ./services/stock-service
    container_name: teaching-stock-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8082:8082"
    depends_on:
      - mysql
      - nacos
    networks:
      - teaching-network

  point-service:
    build: ./services/point-service
    container_name: teaching-point-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8083:8083"
    depends_on:
      - mysql
      - nacos
    networks:
      - teaching-network
