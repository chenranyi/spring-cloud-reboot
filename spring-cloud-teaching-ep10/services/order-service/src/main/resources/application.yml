server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/order_db
    username: root
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:8848

seata:
  enabled: true
  application-id: order-service
  tx-service-group: teaching_tx_group
  service:
    vgroup-mapping:
      teaching_tx_group: default
    grouplist:
      default: ${SEATA_HOST:localhost}:8091

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.teaching: INFO
