server:
  port: 8083

spring:
  application:
    name: point-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/point_db
    username: root
    password: ${DB_PASSWORD:root123}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:8848

seata:
  enabled: true
  application-id: point-service
  tx-service-group: teaching_tx_group
  service:
    vgroup-mapping:
      teaching_tx_group: default
    grouplist:
      default: ${SEATA_HOST:localhost}:8091

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

logging:
  level:
    com.teaching: INFO
