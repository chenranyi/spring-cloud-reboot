version: '3.8'

services:
  # Nacos
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos-teaching
    environment:
      MODE: standalone
    ports:
      - "8848:8848"
      - "9848:9848"
    restart: always
    networks:
      - teaching-network

  # Sentinel
  sentinel:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: sentinel-teaching
    ports:
      - "8858:8858"
    environment:
      - AUTH_USERNAME=sentinel
      - AUTH_PASSWORD=sentinel
    restart: always
    networks:
      - teaching-network

  # Elasticsearch（SkyWalking 存储）
  elasticsearch:
    image: elasticsearch:7.17.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - teaching-network

  # SkyWalking OAP 服务
  oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: oap
    depends_on:
      - elasticsearch
    environment:
      - SW_STORAGE=elasticsearch
      - SW_STORAGE_ES_CLUSTER_NODES=elasticsearch:9200
    ports:
      - "11800:11800"
      - "12800:12800"
    networks:
      - teaching-network

  # SkyWalking UI
  ui:
    image: apache/skywalking-ui:9.7.0
    container_name: ui
    depends_on:
      - oap
    environment:
      - SW_OAP_ADDRESS=http://oap:12800
    ports:
      - "8088:8080"
    networks:
      - teaching-network

networks:
  teaching-network:
    driver: bridge
