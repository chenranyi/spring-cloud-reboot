server:
  port: 8082

spring:
  application:
    name: stock-service
  datasource:
    url: jdbc:mysql://localhost:3306/stock_db
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

seata:
  enabled: true
  application-id: stock-service
  tx-service-group: teaching_tx_group
  service:
    vgroup-mapping:
      teaching_tx_group: default
    grouplist:
      default: 127.0.0.1:8091

logging:
  level:
    com.teaching: DEBUG
    io.seata: DEBUG
