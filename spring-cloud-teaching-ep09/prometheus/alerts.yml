groups:
  - name: service_alerts
    rules:
      - alert: ServiceDown
        expr: up{job=~"order-service|stock-service|point-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "服务 {{ $labels.job }} 已宕机"
          description: "服务 {{ $labels.job }} 已停止响应超过 1 分钟"

      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[2m])) 
          / 
          sum(rate(http_server_requests_seconds_count[2m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} 错误率过高"
          description: "错误率超过 5%"

      - alert: SlowResponse
        expr: |
          histogram_quantile(0.99, 
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le, job)
          ) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} 响应过慢"
          description: "P99 响应时间超过 2 秒"
