server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://localhost:3306/order_db
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

seata:
  enabled: true
  application-id: order-service
  tx-service-group: teaching_tx_group
  service:
    vgroup-mapping:
      teaching_tx_group: default
    grouplist:
      default: 127.0.0.1:8091

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  endpoint:
    prometheus:
      enabled: true
    metrics:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: 1.0.0
    description: Spring Cloud 教学项目

logging:
  level:
    com.teaching: DEBUG
    io.seata: DEBUG
